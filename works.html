<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e10;
    --bg-soft:#161618;
    --fg:#efece4;
    --muted:#8c897f;
    --accent:#fd5a1e;
    --line: rgba(239,236,228,0.14);
    --mono: 'IBM Plex Mono', monospace;
    --display: 'M PLUS 2', sans-serif;
    --body: 'M PLUS 2', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--body);
    font-weight:300;
    overflow-x:hidden;
    padding-bottom:56px;
  }
  ::selection{background:var(--accent); color:var(--fg);}

  nav{
    position:fixed; top:0; left:0; width:100%; z-index:90;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 32px 0 32px;
    mix-blend-mode:difference;
  }
  .logo{
    font-family:var(--display); font-size:15px; letter-spacing:0.14em;
    text-transform:uppercase; font-weight:500; text-decoration:none; color:var(--fg);
  }
  .navlinks{display:flex; gap:28px; list-style:none;}
  .navlinks a{
    color:var(--fg); text-decoration:none;
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em;
    display:flex; align-items:center; gap:8px; opacity:0.85;
  }
  .navlinks a .tc{color:var(--muted);}
  .navlinks a:hover{opacity:1;}

  main{padding:0 32px;}

  .section-head{
    display:flex; align-items:baseline; gap:18px;
    padding-top:140px; margin-bottom:56px;
  }
  .section-head .tc{font-family:var(--mono); font-size:12px; color:var(--accent);}
  .section-head h1{
    font-family:var(--display); font-weight:500; font-size:28px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .section-head .rule{flex:1; height:1px; background:var(--line);}
  .section-head .count{font-family:var(--mono); font-size:12px; color:var(--muted);}

  .works-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:40px;
    padding-bottom:64px;
  }

  .pagination{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding-bottom:120px;
    font-family:var(--mono); font-size:14px; letter-spacing:0.04em;
  }
  .pagination .page-btn{
    background:none; border:none; color:var(--muted);
    cursor:pointer; padding:6px 4px; transition:color .2s ease;
  }
  .pagination .page-btn:hover{color:var(--fg);}
  .pagination .page-btn.active{color:var(--accent);}
  .pagination .sep{color:var(--line); font-size:12px;}
  .work-card{cursor:pointer;}
  .work-thumb{
    position:relative; aspect-ratio:16/10; overflow:hidden;
    background:var(--bg-soft);
  }
  .work-thumb img{
    width:100%; height:100%; object-fit:cover;
    filter:grayscale(70%) brightness(0.6);
    transition:filter .5s ease, transform .6s ease;
    display:block;
  }
  .work-card:hover .work-thumb img{filter:grayscale(0%) brightness(0.85); transform:scale(1.04);}
  .work-thumb.thumb-fallback{
    background:linear-gradient(135deg, var(--bg-soft), #1c1c1e);
  }
  .play-glyph{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; border:1px solid var(--fg); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .3s ease, transform .3s ease; z-index:2;
  }
  .work-card:hover .play-glyph{opacity:1; transform:translate(-50%,-50%) scale(1.05);}
  .play-glyph::after{
    content:''; border-style:solid; border-width:6px 0 6px 10px;
    border-color:transparent transparent transparent var(--fg);
    margin-left:3px;
  }
  .work-meta{
    padding-top:16px; display:flex; justify-content:space-between; align-items:baseline;
  }
  .work-meta h3{font-family:var(--display); font-size:16px; font-weight:500; letter-spacing:0.02em;}
  .work-meta span{font-family:var(--mono); font-size:11px; color:var(--muted); display:block; margin-top:4px;}


  .modal{
    position:fixed; inset:0; z-index:200; display:none;
    background:rgba(8,8,9,0.92); align-items:center; justify-content:center;
    padding:40px;
  }
  .modal.open{display:flex;}
  .modal-inner{width:100%; max-width:960px;}
  .modal-video{position:relative; width:100%; padding-top:56.25%; background:#000;}
  .modal-video iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .modal-close{
    display:block; margin:0 0 14px auto;
    background:none; border:1px solid var(--line); color:var(--fg);
    font-family:var(--mono); font-size:12px; padding:8px 14px; cursor:pointer;
  }
  .modal-close:hover{border-color:var(--fg);}

  footer{
    position:fixed; bottom:0; left:0; width:100%; z-index:95;
    background:rgba(14,14,16,0.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-top:1px solid var(--line); padding:14px 32px;
    display:flex; justify-content:center; align-items:center;
    font-family:var(--mono); font-size:11px; color:var(--muted);
  }
  footer a{color:var(--muted); text-decoration:none; margin-left:16px;}
  footer a:hover{color:var(--fg);}
  footer .social a{
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--muted); transition:color .25s ease;
  }
  footer .social a:hover{color:var(--accent);}

  .menu-toggle{
    display:none; background:none; border:0; cursor:pointer;
    width:26px; height:18px; flex-direction:column; justify-content:space-between;
    padding:0; z-index:120;
  }
  .menu-toggle span{
    display:block; width:100%; height:1px; background:var(--fg);
    transition:transform .3s ease, opacity .3s ease;
  }
  .menu-toggle.open span:first-child{transform:translateY(8.5px) rotate(45deg);}
  .menu-toggle.open span:last-child{transform:translateY(-8.5px) rotate(-45deg);}

  .mobile-menu{
    display:none; position:fixed; inset:0; z-index:110;
    background:var(--bg);
    flex-direction:column; align-items:center; justify-content:center; gap:36px;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .mobile-menu.open{opacity:1; pointer-events:auto;}
  .mobile-menu a{
    color:var(--fg); text-decoration:none;
    font-family:var(--mono); font-size:18px; letter-spacing:0.08em;
    display:flex; align-items:center; gap:12px;
  }
  .mobile-menu a .tc{color:var(--muted);}

  @media(max-width:760px){
    .navlinks{display:none;}
    .menu-toggle{display:flex;}
    .mobile-menu{display:flex;}
    .works-grid{grid-template-columns:1fr;}
  }
  @media(min-width:761px) and (max-width:1100px){
    .works-grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">Tasuku Ito</a>
  <ul class="navlinks">
    <li><a href="index.html#about"><span class="tc">01 /</span>ABOUT</a></li>
    <li><a href="works.html"><span class="tc">02 /</span>WORKS</a></li>
    <li><a href="index.html#contact"><span class="tc">03 /</span>CONTACT</a></li>
  </ul>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
    <span></span><span></span>
  </button>
</nav>
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html#about"><span class="tc">01 /</span>ABOUT</a>
  <a href="works.html"><span class="tc">02 /</span>WORKS</a>
  <a href="index.html#contact"><span class="tc">03 /</span>CONTACT</a>
</div>

<main>
  <div class="section-head">
    <span class="tc">02 / WORKS</span>
    <div class="rule"></div>
    <span class="count" id="worksCount"></span>
  </div>
  <div class="works-grid" id="worksGrid"></div>
  <div class="pagination" id="pagination"></div>
</main>

<div class="modal" id="videoModal">
  <div class="modal-inner">
    <button class="modal-close" id="modalClose">CLOSE ✕</button>
    <div class="modal-video" id="modalVideo"></div>
  </div>
</div>

<footer>
  <div class="social">
    <a href="https://www.instagram.com/tsk_it/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
  </div>
</footer>

<script>
  // WORKS — full list, newest first (same data as top page preview)
  const works = [
    {id:"qDZknrdg418", client:"McGuffin", role:"Direction / Edit"},
    {id:"t6G8w736NG0", client:"McGuffin", role:"Direction"},
    {id:"8h2_cZz0EBA", client:"McGuffin", role:"Direction"},
    {id:"VmcelxT5KMA", client:"60%", role:"Direction / Camera / Edit"},
    {id:"EWPD5_QEDLc", client:"McGuffin", role:"Direction"},
    {id:"GHt7iW8dlqE", client:"McGuffin", role:"Direction / Camera"},
    {id:"VFzIWwEtApA", client:"McGuffin", role:"Direction"},
    {id:"IIMhWGpHH3M", client:"McGuffin", role:"Direction"},
    {id:"AllWJGca0fQ", client:"McGuffin", role:"Camera"},
    {id:"xFaxr_-NJBw", client:"McGuffin", role:"Direction"},
    {id:"Xqse72vh-co", client:"McGuffin", role:"Direction / Camera"},
    {id:"RNlK2_SK2dA", client:"McGuffin", role:"Direction"},
    {id:"w0FRDFsryBU", client:"McGuffin", role:"Direction / Camera / Edit"},
    {id:"3ooh0Al5B6c", client:"McGuffin", role:"Direction"},
    {id:"-LwnXl5pn64", client:"McGuffin", role:"Direction"},
    {id:"6rvOAz7UfhI", client:"McGuffin", role:"Direction"},
    {id:"OiLO0BMUx5s", client:"McGuffin", role:"Direction"},
    {id:"dkB0eNlgAkk", client:"McGuffin", role:"Direction"},
    {id:"90N24ywwfJ8", client:"McGuffin", role:"Direction"},
    {id:"es8jcjImYgk", client:"McGuffin", role:"Direction / Camera / Edit"},
    {id:"OqkC6XZhMy8", client:"McGuffin", role:"Direction / Camera / Edit"},
    {id:"kSY-uHGkXzM", client:"McGuffin", role:"Direction / Camera / Edit"},
    {id:"c6y7Ggs3SRw", client:"McGuffin", role:"Direction"},
    {id:"uUVyxKnQJX0", client:"McGuffin", role:"Direction / Edit"},
    {id:"AaNaOsYLPS0", client:"McGuffin", role:"Direction"},
    {id:"-aBybXZc6nQ", client:"McGuffin", role:"Direction"},
    {id:"0sODqLsm61M", client:"McGuffin", role:"Direction"},
    {id:"yLQV4G5WXMM", client:"McGuffin", role:"Direction"},
    {id:"eov2mOpd0As", client:"McGuffin", role:"Direction"},
    {id:"sdRBw_xNTdA", client:"McGuffin", role:"Direction"},
    {id:"xpXR_3HrQrg", client:"McGuffin", role:"Direction / Camera / Edit"},
    {id:"Rog74Xfl3k8", client:"McGuffin", role:"Direction"}
  ];

  document.getElementById('worksCount').textContent = `ALL / ${works.length} FILMS`;

  const PAGE_SIZE = 10;
  const totalPages = Math.ceil(works.length / PAGE_SIZE);
  let currentPage = 1;

  const grid = document.getElementById('worksGrid');
  const paginationEl = document.getElementById('pagination');

  function renderWorks(page){
    currentPage = page;
    grid.innerHTML = '';
    const start = (page - 1) * PAGE_SIZE;
    const pageItems = works.slice(start, start + PAGE_SIZE);

    pageItems.forEach((w, i) => {
      const globalIndex = start + i;
      const card = document.createElement('div');
      card.className = 'work-card';
      card.innerHTML = `
        <div class="work-thumb">
          <img src="https://i.ytimg.com/vi/${w.id}/hqdefault.jpg" loading="lazy" alt="${w.client}" onerror="this.style.display='none'; this.closest('.work-thumb').classList.add('thumb-fallback');">
          <div class="play-glyph"></div>
        </div>
        <div class="work-meta"><h3>${w.client}</h3><span>${w.role}</span></div>
      `;
      card.addEventListener('click', () => openModal(w.id));
      grid.appendChild(card);
    });

    renderPagination();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function renderPagination(){
    paginationEl.innerHTML = '';
    for(let p = 1; p <= totalPages; p++){
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
      btn.textContent = p;
      btn.addEventListener('click', () => renderWorks(p));
      paginationEl.appendChild(btn);
      if(p < totalPages){
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '›';
        paginationEl.appendChild(sep);
      }
    }
  }

  renderWorks(1);

  const modal = document.getElementById('videoModal');
  const modalVideo = document.getElementById('modalVideo');
  function openModal(id){
    modalVideo.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    modal.classList.add('open');
  }
  function closeModal(){
    modal.classList.remove('open');
    modalVideo.innerHTML = '';
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

  // mobile menu toggle
  const menuToggle = document.getElementById('menuToggle');
  const mobileMenu = document.getElementById('mobileMenu');
  if(menuToggle && mobileMenu){
    menuToggle.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('open');
      menuToggle.classList.toggle('open', isOpen);
      menuToggle.setAttribute('aria-expanded', isOpen);
    });
    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
        menuToggle.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
    mobileMenu.addEventListener('click', (e) => {
      if(e.target === mobileMenu){
        mobileMenu.classList.remove('open');
        menuToggle.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });
  }
</script>

</body>
</html>
